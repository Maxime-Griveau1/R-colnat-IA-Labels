services:

  flask:
    build: ./APP
    ports:
      - "5000:5000"
    volumes:
      - ./APP/Datas:/app/Datas
      - ./APP/app:/app/app
    environment:
      FLASK_HOST: "0.0.0.0"
      DEBUG: "True"
      SECRET_KEY: "151515670"
      WTF_CSRF_ENABLE: "True"
      # URL interne Docker — Flask appelle Label Studio via le réseau Docker
      LABEL_STUDIO_URL: "http://label-studio:8080"
      # URL publique — utilisée uniquement pour les liens dans le navigateur
      LABEL_STUDIO_PUBLIC_URL: "http://localhost:8080"
   
      LABEL_STUDIO_API_KEY: "ea87407f0fef277b1e7102af14308ed8643bd327"
      LABEL_STUDIO_PROJECT_ID: "11"
      LABEL_STUDIO_FIELDS_PROJECT_ID: "12"
    depends_on:
      - label-studio
    restart: unless-stopped

  label-studio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8080:8080"
    volumes:
      - label_studio_data:/label-studio/data
    environment:
      LABEL_STUDIO_USERNAME: "griveaumaxime@gmail.com"
      LABEL_STUDIO_PASSWORD: "coffrE6*forT4_label-studio"
      SECRET_KEY: "mnhn-ls-secret-key-change-me"
    restart: unless-stopped

volumes:
  label_studio_data:
